packages:
  - 'packages/*'
catalog:
  '@oxlint/plugins': ^1.90.0
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
allowBuilds:
  esbuild: true
  # wrangler-action runs `pnpm add wrangler` for the Cloudflare Pages deploy;
  # wrangler pulls workerd, whose build script pnpm would otherwise treat
  # as an undecided build and fail with ERR_PNPM_IGNORED_BUILDS. We don't need
  # workerd compiled for a static Pages upload — `false` skips it without error.
  workerd: false
  # wrangler@4 also pulls `sharp` (native image lib) with a build script. Same
  # deal as workerd: we're uploading prebuilt static files, so sharp never runs.
  # `false` decides it so pnpm doesn't fail with ERR_PNPM_IGNORED_BUILDS.
  sharp: false
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
